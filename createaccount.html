<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account - Tic Tac Toe</title>
  <link rel="icon" type="image/x-icon" href="/assets/logo.ico">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="createaccount.css"/>
  <style>
    .tab-row {
      display: flex;
      width: 100%;
      border-bottom: 2px solid #e8e8e8;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #bbb;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .tab-btn.active {
      color: #333;
      border-bottom-color: #f1b211;
    }

    .tab-panel { display: none; width: 100%; }
    .tab-panel.active { display: contents; }

    .checkbox-row {
      display: flex;
      gap: 14px;
      width: 100%;
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border: 2px solid #d4d4d4;
      border-radius: 10px;
      cursor: pointer;
      flex: 1;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #555;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }

    .checkbox-option input[type="checkbox"] {
      accent-color: #f1b211;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .checkbox-option:has(input:checked) {
      border-color: #f1b211;
      background: #fffbf0;
      color: #333;
    }

    .checkbox-hint {
      font-family: 'Nunito', sans-serif;
      font-size: 0.78rem;
      color: #bbb;
      margin-top: 2px;
      width: 100%;
    }

    .upgrade-info {
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      color: #888;
      background: #fffbf0;
      border: 1px solid #f1b21133;
      border-radius: 10px;
      padding: 12px 16px;
      width: 100%;
      line-height: 1.5;
      box-sizing: border-box;
    }

    .upgrade-info strong { color: #f1b211; }
  </style>
</head>
<body>

  <div class="sidebar">
    <nav class="sidebar-nav">
      <div class="logo-container">
        <a href="home.html"><img src="assets/tttLogo.png" alt="logo" class="logo"></a>
      </div>
      <button class="nav-btn" onclick="window.location.href='home.html'">🏠 Home</button>
      <button class="nav-btn" onclick="window.location.href='play.html'">🎮 Play</button>
      <button class="nav-btn" onclick="window.location.href='leaderboard.html'">🏆 Leaderboard</button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">👤 Profile</button>
    </nav>
  </div>

  <main class="main">
    <div class="card">
      <h1 class="title" id="page-title">Create Account</h1>

      <!-- Tabs -->
      <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab('new')">New Account</button>
        <button class="tab-btn" onclick="switchTab('upgrade')">Upgrade Existing</button>
      </div>

      <!-- ── NEW ACCOUNT TAB ── -->
      <div class="tab-panel active" id="tab-new">

        <div class="form-group">
          <p style="font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:4px;">Account Type</p>
          <div class="checkbox-row">
            <label class="checkbox-option">
              <input type="checkbox" id="type-player" checked />
              🎮 Player
            </label>
            <label class="checkbox-option">
              <input type="checkbox" id="type-manager" />
              🛠️ Manager
            </label>
          </div>
          <p class="checkbox-hint">Player = join tournaments &nbsp;·&nbsp; Manager = create tournaments</p>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username"/>
          <span class="field-msg" id="username-msg"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email"/>
          <span class="field-msg" id="email-msg"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password"/>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm password"/>
          <span class="field-msg" id="password-msg"></span>
        </div>

        <button class="btn btn-play" onclick="handleSignup()">
          <span>Create Account</span>
        </button>

        <p class="result-msg" id="result-msg"></p>

        <p class="login-link">Already have an account? <a href="login.html">Login</a></p>

      </div>

      <!-- ── UPGRADE TAB ── -->
      <div class="tab-panel" id="tab-upgrade">

        <p class="upgrade-info">
          Already have a player account? Enter your credentials below to add
          <strong>Tournament Manager</strong> privileges — you'll keep everything you have.
        </p>

        <div class="form-group">
          <label for="up-username">Username</label>
          <input type="text" id="up-username" placeholder="Your existing username"/>
        </div>

        <div class="form-group">
          <label for="up-password">Password</label>
          <input type="password" id="up-password" placeholder="Your password"/>
        </div>

        <button class="btn btn-play" onclick="handleUpgrade()">
          <span>Upgrade to Manager</span>
        </button>

        <p class="result-msg" id="upgrade-result-msg"></p>

        <p class="login-link">Don't have an account? <a href="#" onclick="switchTab('new')">Create one</a></p>

      </div>

    </div>
  </main>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-new').classList.toggle('active', tab === 'new');
      document.getElementById('tab-upgrade').classList.toggle('active', tab === 'upgrade');
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'new') || (i === 1 && tab === 'upgrade'));
      });
      document.getElementById('page-title').textContent = tab === 'new' ? 'Create Account' : 'Upgrade Account';
    }

    // ── NEW ACCOUNT ──
    document.getElementById('username').addEventListener('input', function () {
      const msg = document.getElementById('username-msg');
      if (this.value.trim().length < 3) {
        msg.textContent = 'Username must be at least 3 characters';
        msg.className = 'field-msg error';
        return;
      }
      fetch(`check_availability.php?field=Username&value=${encodeURIComponent(this.value.trim())}`)
        .then(r => r.json())
        .then(d => {
          msg.textContent = d.taken ? '✗ Username already taken' : '✓ Username available';
          msg.className   = d.taken ? 'field-msg error' : 'field-msg success';
        });
    });

    document.getElementById('email').addEventListener('input', function () {
      const msg = document.getElementById('email-msg');
      if (!this.value.includes('@')) return;
      fetch(`check_availability.php?field=Email&value=${encodeURIComponent(this.value.trim())}`)
        .then(r => r.json())
        .then(d => {
          msg.textContent = d.taken ? '✗ Email already registered' : '✓ Email available';
          msg.className   = d.taken ? 'field-msg error' : 'field-msg success';
        });
    });

    document.getElementById('confirm-password').addEventListener('input', function () {
      const msg   = document.getElementById('password-msg');
      const match = this.value === document.getElementById('password').value;
      msg.textContent = match ? '✓ Passwords match' : '✗ Passwords do not match';
      msg.className   = match ? 'field-msg success' : 'field-msg error';
    });

    function handleSignup() {
      const isPlayer  = document.getElementById('type-player').checked;
      const isManager = document.getElementById('type-manager').checked;
      const username  = document.getElementById('username').value.trim();
      const email     = document.getElementById('email').value.trim();
      const password  = document.getElementById('password').value;
      const confirm   = document.getElementById('confirm-password').value;
      const resultMsg = document.getElementById('result-msg');

      if (!isPlayer && !isManager) { resultMsg.textContent = 'Select at least one account type'; resultMsg.className = 'result-msg error'; return; }
      if (!username || !email || !password || !confirm) { resultMsg.textContent = 'Please fill in all fields'; resultMsg.className = 'result-msg error'; return; }
      if (username.length < 3) { resultMsg.textContent = 'Username must be at least 3 characters'; resultMsg.className = 'result-msg error'; return; }
      if (password !== confirm) { resultMsg.textContent = 'Passwords do not match'; resultMsg.className = 'result-msg error'; return; }

      const fd = new FormData();
      fd.append('username',  username);
      fd.append('email',     email);
      fd.append('password',  password);
      fd.append('isPlayer',  isPlayer  ? '1' : '0');
      fd.append('isManager', isManager ? '1' : '0');

      fetch('insert_user.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            window.location.href = 'home.html';
          } else {
            resultMsg.textContent = d.error || 'Something went wrong';
            resultMsg.className = 'result-msg error';
          }
        })
        .catch(() => { resultMsg.textContent = 'Could not connect to server'; resultMsg.className = 'result-msg error'; });
    }

    // ── UPGRADE EXISTING ──
    function handleUpgrade() {
      const username  = document.getElementById('up-username').value.trim();
      const password  = document.getElementById('up-password').value;
      const resultMsg = document.getElementById('upgrade-result-msg');

      if (!username || !password) {
        resultMsg.textContent = 'Please fill in all fields';
        resultMsg.className = 'result-msg error';
        return;
      }

      const fd = new FormData();
      fd.append('username', username);
      fd.append('password', password);

      fetch('upgrade_to_manager.php', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            resultMsg.textContent = '✓ Account upgraded! Redirecting...';
            resultMsg.className = 'result-msg success';
            setTimeout(() => window.location.href = 'home.html', 1500);
          } else {
            resultMsg.textContent = d.error || 'Something went wrong';
            resultMsg.className = 'result-msg error';
          }
        })
        .catch(() => { resultMsg.textContent = 'Could not connect to server'; resultMsg.className = 'result-msg error'; });
    }
  </script>

</body>
</html>
