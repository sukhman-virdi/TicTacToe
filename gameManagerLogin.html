<!DOCTYPE html>
<html lang="en"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manager Login - Tic Tac Toe</title>
  <link rel="icon" type="image/x-icon" href="/tictactoe/assets/logo.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="login.css"/> 
</head>
<body>  

  <div class="sidebar">
    <nav class="sidebar-nav">
      <div class="logo-container">
        <a href="home.html">
          <img src="assets/tttLogo.png" alt="logo" class="logo">
        </a>
      </div> 
      <button class="nav-btn" onclick="window.location.href='home.html'">🏠 Home</button>
      <button class="nav-btn" onclick="window.location.href='play.html'">🎮 Play</button>
      <button class="nav-btn" onclick="window.location.href='leaderboard.html'">🏆 Leaderboard</button>
      <button class="nav-btn" onclick="window.location.href='matches.html'">🔍 Matches</button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">👤 Profile</button>
      <p id="greeting"></p>
      <p class="signout-link" id="signout">
        <a href="logout.php">Sign Out</a>
      </p>
    </nav> 
  </div>   

  <main class="main">
    <div class="card">
      <h1 class="title">Manager Login</h1>

      <div class="form-group">
        <label for="login">Username or Email</label>
        <input type="text" id="login" placeholder="Enter username or email"/>
        <span class="field-msg" id="login-msg"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password"/>
        <span class="field-msg" id="password-msg"></span>
      </div>

      <button class="btn btn-secondary" onclick="handleLogin()">
        <span>Login</span>
      </button>

      <p class="result-msg" id="result-msg"></p>

      <p class="login-link">Don't have a manager account?
        <a href="createaccount.html">Sign Up</a> 
      </p>
      <p class="login-link">
        <a href="login.html">Login as Player instead</a>
      </p>
    </div>

    <!-- Success Popup -->
    <div class="popup" id="popup">
      <div class="popup-box">
        <h2>👋 Welcome Back!</h2>
        <p>Logged in as <span id="popup-username"></span></p>
        <p>Redirecting to home page...</p>
      </div>
    </div>
  </main> 

  <script>
    function handleLogin() {
      const login     = document.getElementById('login').value.trim();
      const password  = document.getElementById('password').value.trim();
      const resultMsg = document.getElementById('result-msg');

      ['login', 'password'].forEach(id => {
        document.getElementById(id).style.borderColor = document.getElementById(id).value.trim() ? '#ddd' : 'red';
      });

      if (!login || !password) {
        resultMsg.textContent = 'Please fill in all fields';
        resultMsg.className = 'result-msg error';
        return;
      }

      const formData = new FormData();
      formData.append('login',    login);
      formData.append('password', password);

      fetch('login.php', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            // Check if this user is actually a manager
            if (!data.isManager) {
              resultMsg.textContent = 'This account does not have Manager privileges. Upgrade your account or use Player login.';
              resultMsg.className = 'result-msg error';
              // Log them back out
              fetch('logout.php');
              return;
            }
            document.getElementById('popup-username').textContent = data.username;
            document.getElementById('popup').classList.add('show');
            setTimeout(() => window.location.href = 'managerHome.html', 2000);
          } else {
            resultMsg.textContent = data.error || 'Invalid username or password';
            resultMsg.className = 'result-msg error';
          }
        })
        .catch(() => {
          resultMsg.textContent = 'Could not connect to server';
          resultMsg.className = 'result-msg error';
        });
    }

    document.getElementById('login').addEventListener('input', function () {
      this.style.borderColor = '#ddd';
      document.getElementById('result-msg').textContent = '';
    });

    document.getElementById('password').addEventListener('input', function () {
      this.style.borderColor = '#ddd';
      document.getElementById('result-msg').textContent = '';
    });

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    fetch('get_session.php')
      .then(res => res.json())
      .then(data => {
        document.getElementById('greeting').textContent = data.loggedIn ? `Hello, ${data.username}` : '';
        document.getElementById('signout').style.display = data.loggedIn ? 'block' : 'none';
      });
  </script>

</body>
</html>
