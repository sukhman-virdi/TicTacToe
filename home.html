<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="icon" type="image/x-icon" href="/assets/logo.ico">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="home.css"/>
</head>
<body> 
 
  <div class="sidebar">
    <nav class="sidebar-nav">
      <div class="logo-container">
        <a href="home.html">
          <img src="assets/tttLogo.png" alt="logo" class="logo">
        </a>
      </div> 
      <button class="nav-btn" onclick="window.location.href='home.html'">🏠 Home</button>
      <button class="nav-btn" onclick="window.location.href='play.html'">🎮 Play</button>
      <button class="nav-btn" onclick="window.location.href='leaderboard.html'">🏆 Leaderboard</button>
      <button class="nav-btn" onclick="window.location.href='matches.html'">🔍 Matches</button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">👤 Profile</button>
      <p id="greeting"></p>
      <p class="signout-link" id="signout">
        <a href="logout.php">Sign Out</a>
      </p>
    </nav>
  </div> 
 
  <main class="main">
    <div class="card">
      <h1 class="title">Tic Tac Toe</h1>
 
      <button class="btn btn-play" onclick="window.location.href='play.html'"><span>Play Now!</span></button>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="window.location.href='login.html'"><span>Login</span></button>
      <button class="btn btn-secondary" onclick="window.location.href='createaccount.html'"><span>Sign Up</span></button>
    </div>
    </div>  
  </main>

  <script>
    fetch('get_session.php')
      .then(res => res.json())
      .then(data => {
        const greeting = document.getElementById('greeting');
        const signout = document.getElementById('signout');

        if (data.loggedIn) {
          greeting.textContent = `Hello, ${data.username}`;
          signout.style.display = 'block'; 
        } else {
          greeting.textContent = ''; // or "Hello, Guest"
          signout.style.display = 'none';
        }
      })
      .catch(err => console.error(err));

  </script>
  
</body>
</html>
