<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="icon" type="image/x-icon" href="/assets/logo.ico">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body> 
 
  <div class="sidebar">
    <nav class="sidebar-nav">
      <div class="logo-container">
        <a href="home.html">
          <img src="assets/tttLogo.png" alt="logo" class="logo">
        </a>
      </div> 
      <button class="nav-btn" onclick="window.location.href='home.html'">🏠 Home</button>
      <button class="nav-btn" onclick="window.location.href='game.html'">🎮 Play</button>
      <button class="nav-btn" onclick="window.location.href='leaderboard.html'">🏆 Leaderboard</button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">👤 Profile</button>
      <p id="greeting"></p>
    </nav>
  </div> 
 
  <main class="main">
    <div class="card">
        <h1 class="title" style="font-size: 8rem;">Stuff Login</h1>
      <h1 class="title" style="font-size: 5rem;">Select Role</h1>
 
    <button class="btn btn-play" onclick="window.location.href='gameManagerLogin.html'"><span>Game Manager</span></button>
    <button class="btn btn-play" onclick="window.location.href='adminLogin.html'"><span>Admin</span></button>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="window.location.href='login.html'"><span>Login As a Game User</span></button>
    </div>
    </div>  
  </main>
  
  <script>
    //Load greeting message
    fetch('get_session.php')
      .then(res => res.json())
      .then(data => {
        const greeting = document.getElementById('greeting');

        if (data.loggedIn) {
          greeting.textContent = `Hello, ${data.username}`;
        } else {
          greeting.textContent = ''; // or "Hello, Guest"
        }
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
