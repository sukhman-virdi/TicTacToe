<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="icon" type="image/x-icon" href="/tictactoe/assets/logo.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="home.css"/>
</head>
<body> 
 
  <div class="sidebar">
    <nav class="sidebar-nav">
      <div class="logo-container">
        <a href="adminHome.html">
          <img src="assets/tttLogo.png" alt="logo" class="logo">
        </a>
      </div> 
      <button class="nav-btn" onclick="window.location.href='adminHome.html'">🏠 Home</button>
      <button class="nav-btn" onclick="window.location.href='overseepeople.html'">👥 Oversee People</button>
      <button class="nav-btn" onclick="window.location.href='editAdmin.html'">✏️ Edit Admins</button>
      <button class="nav-btn" onclick="window.location.href='editachievements.html'">🏆 Edit Achievement</button>
      <button class="nav-btn" onclick="window.location.href='adminProfile.html'">👤 Profile</button>
      <p id="greeting"></p>
      <p class="signout-link" id="signout">
        <a href="logout.php">Sign Out</a>
      </p>
    </nav>
  </div> 
 
  <main class="main">
    <div class="card">
      <h1 class="title" style="font-size: 8rem;">Tic Tac Toe</h1>
      <h2 class="title">Admin Page</h2>
 
    <button class="btn btn-play" onclick="window.location.href='overseepeople.html'"><span>Oversee People</span></button>
    <button class="btn btn-play" onclick="window.location.href='editachievements.html'"><span>Edit Achievement</span></button>

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="window.location.href='adminLoginAtHome.html'"><span>Change Admin</span></button>
      <button class="btn btn-secondary" onclick="window.location.href='logout.php'"><span>Sign Out</span></button>
    </div>
    </div>  
  </main>
  
  <script>
  //Load greeting message
    fetch('get_adminSession.php')
      .then(res => res.json())
      .then(data => {
        const greeting = document.getElementById('greeting');
        const signout = document.getElementById('signout');

        if (data.loggedIn) {
          greeting.textContent = `Hello, ${data.name}`;
          signout.style.display = 'block'; 
        } else {
          greeting.textContent = ''; // or "Hello, Guest"
          signout.style.display = 'none';
        }
      })
      .catch(err => console.error(err));


  </script>
</body>
</html>
