<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <link rel="icon" type="image/x-icon" href="/tictactoe/assets/logo.ico"/>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="profile.css"/>
</head>
<body>
 
  <div class="sidebar">
    <nav class="sidebar-nav">
      <div class="logo-container">
        <a href="managerHome.html">
          <img src="assets/tttLogo.png" alt="logo" class="logo">
        </a>
      </div> 
      <button class="nav-btn" onclick="window.location.href='managerHome.html'">🏠 Home</button>
      <button class="nav-btn" onclick="window.location.href='create_tournament.html'">🏆 Create Tournaments</button>
      <button class="nav-btn" onclick="window.location.href='managerProfile.html'">👤 Profile</button>
      <p id="greeting"></p>
      <p class="signout-link" id="signout">
        <a href="logout.php">Sign Out</a>
      </p>
    </nav>
  </div> 
 
  <main class="main">
    <div class="card">
      <h1 class="title" id="username">Username</h1>
      <p class="login-link">
        <a href="editManagerProfile.html">Edit Profile</a>
      </p>    
    <div class="boxes-row">
  <div class="box">
    <h3>Game Manager Information</h3>
    <hr/>
    <div class="box-table">
        <div class="box-table-row">
            <div class="box-table-cell" >GameManagerID:</div>
            <div class="box-table-cell" id="GameManagerID">...</div>
        </div>
        <div class="box-table-row">
            <div class="box-table-cell">Name:</div>
            <div class="box-table-cell" id="name">...</div>
        </div>
        <div class="box-table-row">
            <div class="box-table-cell" >Email:</div>
            <div class="box-table-cell" id="email">...</div>
        </div>
        <div class="box-table-row">
            <div class="box-table-cell">Tournaments_Organized:</div>
            <div class="box-table-cell" id="Tournaments_Organized">...</div>
        </div>
    </div>
  </div> 
  <div class="box">
    <h3>Achievements</h3>
    <hr/>
    <table class="box-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody id="achievements-tbody">
        <!--Fill table with achievements data from database-->
      </tbody>
    </table>
  </div>
</div>  
 
    


    </div>  
  </main>
  <div id="login-popup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:999;">
  <div style="background:#fff; border-radius:16px; padding:40px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,0.2); display:flex; flex-direction:column; gap:16px; min-width:300px;">
    <h2 style="font-family:'Righteous',cursive; color:#f1b211; font-size:1.5rem;">🔒 Login Required</h2>
    <p style="font-family:'Nunito',sans-serif; color:#444;">Please log in to view your profile.</p>
    <p style="font-family:'Nunito',sans-serif; color:#888; font-size:0.9rem;">Redirecting to login page...</p>
  </div>
</div>
  
  <script>
  fetch('get_managerSession.php')
    .then(res => res.json())
    .then(data => {
      // Update greeting
      const greeting = document.getElementById('greeting');
      const signout  = document.getElementById('signout');

      if (!data.loggedIn) {
        document.getElementById('login-popup').style.display = 'flex';
        setTimeout(() => {
          window.location.href = 'gameManagerLogin.html';
        }, 2000);
        return;
      }

      // Logged in — set greeting
      greeting.textContent = `Hello, ${data.username}`;
      signout.style.display = 'block';

      const GameManagerID = data.userID;

      // Fetch manager profile
      fetch(`get_manager.php?id=${GameManagerID}`)
        .then(res => res.json())
        .then(manager => {
          document.getElementById('username').textContent = data.username;
          document.getElementById('GameManagerID').textContent = manager.ManagerID;
          document.getElementById('name').textContent = manager.Username;
          document.getElementById('email').textContent = manager.Email;
          document.getElementById('Tournaments_Organized').textContent = manager.Tournaments_Organized;
        })
        .catch(err => console.log('Error loading profile:', err));

      // Fetch achievements
      fetch(`get_achievements.php?id=${GameManagerID}`)
        .then(res => res.json())
        .then(achievements => {
          const tbody = document.getElementById('achievements-tbody');
          tbody.innerHTML = '';
          if (achievements.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2">No achievements yet</td></tr>';
            return;
          }
          achievements.forEach(a => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${a.Title}</td>
              <td>${a.Description}</td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(err => console.log('Error loading achievements:', err));
    });
</script>


</body> 
</html>
